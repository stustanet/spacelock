{% extends "base.html" %}

{% block content %}
  {% if expires_soon %}
  <div class="alert alert-warning" role="alert">
      Your Access will expire after {{ expires_soon.date() }} {{ expires_soon.time() }}!
  </div>
  {% endif %}
  <div class="card">
    <div class="card-header bg-success text-white">
      <h5 class="card-title">Access Granted
        <span class="float-right h3" onclick="window.location.reload()">↻</span>
      </h5>
    </div>
    <div class="card-body">
      <div class="card-text">
        <div class="text-center">
          <img src="{{ qrcode(token, border=1) }}" class="img-fluid" alt="{{ token }}">
        </div>
        <div class="pt-3 text-center">
          <a href="{{ token_url }}" target="_blank">Send directly via WIFI</a>
        </div>
        <div class="pt-3 text-center">
          <button class="btn btn-lg btn-primary" onclick="sendToken('{{ token }}')">Bluetooth</button>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
